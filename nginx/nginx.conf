worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Limite le debit de requetes par IP -- protection basique contre l'abus,
    # en complement du throttling deja applique cote Django (core/throttles.py).
    limit_req_zone $binary_remote_addr zone=intelya_general:10m rate=20r/s;

    upstream intelya_backend {
        server backend:8000;
    }

    # ===== REMPLACER intelya-haven.com PAR LE VRAI DOMAINE =====

    # Redirection HTTP -> HTTPS, sauf le challenge ACME de certbot
    server {
        listen 80;
        server_name intelya-haven.com www.intelya-haven.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name intelya-haven.com www.intelya-haven.com;

        ssl_certificate     /etc/letsencrypt/live/intelya-haven.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/intelya-haven.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_req zone=intelya_general burst=40 nodelay;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # WebSocket (chat temps reel via Django Channels / Daphne)
        location /ws/ {
            proxy_pass http://intelya_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://intelya_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
