version: '3.9'

services:

  # BASE DE DONNÉES PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: intelya_db
    environment:
      POSTGRES_DB: intelya_db
      POSTGRES_USER: intelya_user
      POSTGRES_PASSWORD: Intelya123@
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelya_user -d intelya_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # CACHE + BROKER - Redis
  redis:
    image: redis:7.2-alpine
    container_name: intelya_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # BACKEND - Django
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelya_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 intelya.asgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=intelya.settings.development
      - DJANGO_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # CELERY WORKER - Tâches asynchrones
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelya_celery_worker
    command: celery -A intelya worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=intelya.settings.development
      - DJANGO_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # CELERY BEAT - Tâches périodiques
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelya_celery_beat
    command: celery -A intelya beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=intelya.settings.development
      - DJANGO_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
